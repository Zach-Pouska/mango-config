# More option see https://github.com/DreamMaoMao/mango/wiki/
# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0


# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
#ov_tab_mode=1
#ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Misc
syncobj_enable=0
xwayland_persistence=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1


# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
#disable_while_typing=1
#left_handed=0
#middle_button_emulation=1
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xc0ff1eff
maximizescreencolor=0x90aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Set scroller layout on second monitor
tagrule=id:1,monitor_name:DVI-D-1,layout_name:vertical_tile
tagrule=id:2,monitor_name:DVI-D-1,layout_name:vertical_tile
tagrule=id:3,monitor_name:DVI-D-1,layout_name:vertical_tile
tagrule=id:4,monitor_name:DVI-D-1,layout_name:vertical_tile
tagrule=id:5,monitor_name:DVI-D-1,layout_name:vertical_tile
tagrule=id:6,monitor_name:DVI-D-1,layout_name:vertical_tile
tagrule=id:7,monitor_name:DVI-D-1,layout_name:vertical_tile
tagrule=id:8,monitor_name:DVI-D-1,layout_name:vertical_tile
tagrule=id:9,monitor_name:DVI-D-1,layout_name:vertical_tile

# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# window rule 
windowrule=isfloating:1,isoverlay:1,appid:qalculate-gtk
windowrule=isfloating:1,isoverlay:1,appid:timer


# Source other files
source=./monitor.conf
source=./binds.conf
source_optional=~/.config/mangolaptop/laptop.conf # when on the laptop, copy laptop.conf to this directory! 

exec-once=fcitx5 -d
exec-once=~/.config/mango/autostart.sh


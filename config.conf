# More option see https://github.com/DreamMaoMao/mango/wiki/
# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

animations=0

# Master-Stack Layout Setting
new_is_master=0

# Overview Setting
enable_hotarea=0

# Misc
xwayland_persistence=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1


# Trackpad - # need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
#disable_while_typing=1
#left_handed=0
#middle_button_emulation=1
swipe_min_threshold=1

# mouse
mouse_natural_scrolling=0 # need relogin to make it apply

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# Set vertical layout on second monitor
tag_rule=id:1,monitor_name:DVI-D-1,layout_name:vertical_tile
tag_rule=id:2,monitor_name:DVI-D-1,layout_name:vertical_tile
tag_rule=id:3,monitor_name:DVI-D-1,layout_name:vertical_tile
tag_rule=id:4,monitor_name:DVI-D-1,layout_name:vertical_tile
tag_rule=id:5,monitor_name:DVI-D-1,layout_name:vertical_tile
tag_rule=id:6,monitor_name:DVI-D-1,layout_name:vertical_tile
tag_rule=id:7,monitor_name:DVI-D-1,layout_name:vertical_tile
tag_rule=id:8,monitor_name:DVI-D-1,layout_name:vertical_tile
tag_rule=id:9,monitor_name:DVI-D-1,layout_name:vertical_tile


# window rule 
window_rule=is_floating:1,is_overlay:1,app_id:qalculate-gtk
window_rule=is_floating:1,is_overlay:1,app_id:timer

# Disable annoying middle click paste 
disable_middle_paste=1

# Source other files
source=./monitor.conf
source=./binds.conf
source=./appearance.conf
source_optional=~/.config/mangolaptop/laptop.conf # when on the laptop, copy laptop.conf to this directory! 

exec_once=fcitx5 -d
exec_once=~/.config/mango/autostart.sh



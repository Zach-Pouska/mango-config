# keyboard
repeat_rate=60
repeat_delay=320
#numlockon=1
xkb_rules_layout=us


# Trackpad - # need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
trackpad_natural_scrolling=1
trackpad_accel_profile = 1
trackpad_accel_speed = 0 	# 0.0	Speed adjustment (-1.0 to 1.0).
trackpad_scroll_method = 1 	# 1 (Two-finger), 2 (Edge), 4 (Button).
trackpad_click_method  = 2	# 1 (Button areas), 2 (Clickfinger).
trackpad_send_events_mode = 0	#0 (Enabled), 1 (Disabled), 2 (Disabled on external mouse
drag_lock=1			#Lock dragging after tapping.
trackpad_disable_while_typing=0
trackpad_middle_button_emulation=1
swipe_min_threshold=1
gesture_swipe_distance = 300	# 300	Finger travel (px) that corresponds to one full page transition.
gesture_swipe_cancel_ratio = 0.5 # 0.5	Releasing after the last page was dragged past this fraction commits it; below it, the transition animates back.
#trackpad_scroll_factor = 1.0 # 0.1-10.0 Scroll speed

# Touchscreen
touch_enable = 1
touch_enable_mouse_emulation = 0 # 0 - if app doesn't support touch input, ignore



# mouse
mouse_natural_scrolling=0 # need relogin to make it apply



# GESTURES 
# Four finger scroll between tags
#gesturebind=none, right, 4, viewprev_have_client
#gesturebind=none, left, 4, viewnext_have_client
gesturebind=none, left, 4, viewtoright
gesturebind=none, right, 4, viewtoleft

#four finger scroll up for overview
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview



# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=Alt,space,spawn,rofi -config ~/.config/mango/rofi/config.rasi -show drun
bind=super,c,spawn,rofi -config ~/.config/mango/rofi/config-calc.rasi -show calc
bind=Ctrl+Alt,t,spawn,kitty

bind=super,b,spawn,~/.config/mango/scripts/hide_waybar_mango.sh
#bind=none,XF86AudioRaiseVolume,spawn,~/.config/mango/scripts/volume.sh up

# exit,close window
bind=ctrl+alt+shift+super,q,quit
bind=super,q,killclient,
bind=alt,f4,killclient,

# switch window focus
bind=super,j,focusstack,next
bind=super,k,focusstack,last

# Move window focus
bind=super+shift,j,exchange_stack_client,next
bind=super+shift,k,exchange_stack_client,last

# swap window
#bind=SUPER+SHIFT,Up,exchange_client,up
#bind=SUPER+SHIFT,Down,exchange_client,down
#bind=SUPER+SHIFT,Left,exchange_client,left
#bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=super,Tab,toggleoverview,
bind=ALT,Tab,focuslast,

bind=super+shift,space,togglefloating,
#bind=ALT,a,togglemaximizescreen,
bind=super,f,togglefullscreen,
bind=ALT+SHIFT,f,spawn,firefox,
#bind=SUPER,i,minimized,
bind=SUPER+shift,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized

# scroller layout
#bind=ALT,e,set_proportion,1.0
#bind=ALT,x,switch_proportion_preset,
#bind=alt+super+ctrl,Left,scroller_stack,left
#bind=alt+super+ctrl,Right,scroller_stack,right
#bind=alt+super+ctrl,Up,scroller_stack,up
#bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
#bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
#bind=SUPER,Left,viewtoleft,0
#bind=CTRL,Left,viewtoleft_have_client,0
#bind=SUPER,Right,viewtoright,0
#bind=CTRL,Right,viewtoright_have_client,0
#bind=CTRL+SUPER,Left,tagtoleft,0
#bind=CTRL+SUPER,Right,tagtoright,0

bind=super,1,view,1,0
bind=super,2,view,2,0
bind=super,3,view,3,0
bind=super,4,view,4,0
bind=super,5,view,5,0
bind=super,6,view,6,0
bind=super,7,view,7,0
bind=super,8,view,8,0
bind=super,9,view,9,0
bind=super,0,view,00,0

# Special tag
bind=super,t,toggle_special_tag
bind=super+shift,t,tag_special_tag

# Toggle view of tag
bind=super+ctrl,1,toggleview,1,0
bind=super+ctrl,2,toggleview,2,0
bind=super+ctrl,3,toggleview,3,0
bind=super+ctrl,4,toggleview,4,0
bind=super+ctrl,5,toggleview,5,0
bind=super+ctrl,6,toggleview,6,0
bind=super+ctrl,7,toggleview,7,0
bind=super+ctrl,8,toggleview,8,0
bind=super+ctrl,9,toggleview,9,0
bind=super+ctrl,0,toggleview,00,0 # funny, toggle inverts the tag selection

# tagsilent: move client to the tag and not focus it
bind=super+shift,1,tagsilent,1,0
bind=super+shift,2,tagsilent,2,0
bind=super+shift,3,tagsilent,3,0
bind=super+shift,4,tagsilent,4,0
bind=super+shift,5,tagsilent,5,0
bind=super+shift,6,tagsilent,6,0
bind=super+shift,7,tagsilent,7,0
bind=super+shift,8,tagsilent,8,0
bind=super+shift,9,tagsilent,9,0
bind=super+shift,0,tagsilent,1|2|3|4|5|6|7|8|9

# toggletag: toggle tags on window
bind=super+shift+ctrl,1,toggletag,1,0
bind=super+shift+ctrl,2,toggletag,2,0
bind=super+shift+ctrl,3,toggletag,3,0
bind=super+shift+ctrl,4,toggletag,4,0
bind=super+shift+ctrl,5,toggletag,5,0
bind=super+shift+ctrl,6,toggletag,6,0
bind=super+shift+ctrl,7,toggletag,7,0
bind=super+shift+ctrl,8,toggletag,8,0
bind=super+shift+ctrl,9,toggletag,9,0
bind=super+shift+ctrl,0,toggletag,1|2|3|4|5|6|7|8|9


# monitor switch
bind=super+shift,comma,tagmon,left
bind=super+shift,period,tagmon,right
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right

# gaps
bind=super+SHIFT,X,incgaps,1
bind=super+SHIFT,Z,incgaps,-1
bind=super+SHIFT,R,togglegaps

# movewin
bind=super+SHIFT,Up,movewin,+0,-50
bind=super+SHIFT,Down,movewin,+0,+50
bind=super+SHIFT,Left,movewin,-50,+0
bind=super+SHIFT,Right,movewin,+50,+0

# resizewin
bind=super,h,resizewin,-50,+0
bind=super,l,resizewin,+50,+0
bind=super+shift,h,resizewin,+0,-50
bind=super+shift,l,resizewin,+0,+50

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=alt,btn_left,moveresize,curmove
#mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=alt,btn_right,moveresize,curresize

# Axis Bindings
#axisbind=SUPER,UP,viewtoleft_have_client
#axisbind=SUPER,DOWN,viewtoright_have_client

# brightness and volume
bind=none,XF86AudioRaiseVolume,spawn,~/.config/mango/scripts/volume.sh up
bind=none,XF86AudioLowerVolume,spawn,~/.config/mango/scripts/volume.sh down
bind=none,XF86MonBrightnessUp,spawn,~/.config/mango/scripts/brightness.sh up
bind=none,XF86MonBrightnessDown,spawn,~/.config/mango/scripts/brightness.sh down

# Media keys: 
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause

#bind=super+shift,s,spawn_shell,grim -g "$(slurp -b '#2E2A1E55' -c '#fb751bff')" -t png - | wl-copy
bind=super+shift,s,spawn,~/.config/mango/scripts/screenshot.sh freeze-region

bind=super,e,spawn,dolphin 
bind=super,v,spawn,cursor-clip
bind=super+shift,v,spawn,com.saivert.pwvucontrol
#bind=super,p,spawn_shell,env > /tmp/env_from_wm.txt # from debugging env for screenshot

